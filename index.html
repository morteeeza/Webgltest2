<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Responsive Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            padding: 0;
            margin: 0;
            height: 100%;
            background-color: #1F1F20;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1F1F20;
        }

        #unity-canvas {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script src="Build/39.loader.js"></script>
    <script>
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/39.loader.js";
        const config = {
            dataUrl: buildUrl + "/39.data",
            frameworkUrl: buildUrl + "/39.framework.js",
            codeUrl: buildUrl + "/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: true,
            devicePixelRatio: 1
        };

        const canvas = document.querySelector("#unity-canvas");

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const targetAspectRatio = 16 / 9;

            let newWidth = containerWidth;
            let newHeight = containerWidth / targetAspectRatio;

            if (newHeight > containerHeight) {
                newHeight = containerHeight;
                newWidth = containerHeight * targetAspectRatio;
            }

            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);

        createUnityInstance(canvas, config).then(() => {
            resizeCanvas();
        }).catch((message) => {
            console.error(message);
        });
    </script>
</body>
</html>
