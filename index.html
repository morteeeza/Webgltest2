<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1F1F20;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #loading,
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1F1F20;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.5em;
            flex-direction: column;
        }

            #start-overlay button {
                margin-top: 1rem;
                padding: 0.5rem 1.2rem;
                font-size: 1rem;
                cursor: pointer;
                background: white;
                color: #1F1F20;
                border: none;
                border-radius: 8px;
            }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <div id="start-overlay" style="display: none;">
        <div>Click and drag to look around</div>
        <button id="start-button">Start</button>
    </div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/39.loader.js"></script>
    <script>
        const canvas = document.getElementById("unity-canvas");
        const loadingScreen = document.getElementById("loading");
        const startOverlay = document.getElementById("start-overlay");
        const startButton = document.getElementById("start-button");

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        let unityInstance;

        createUnityInstance(canvas, {
            dataUrl: "Build/39.data",
            frameworkUrl: "Build/39.framework.js",
            codeUrl: "Build/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: false,
            devicePixelRatio: window.devicePixelRatio || 1
        }).then((instance) => {
            unityInstance = instance;
            loadingScreen.style.display = 'none';
            startOverlay.style.display = 'flex';
        }).catch((err) => {
            loadingScreen.innerText = "Failed to load game.";
            console.error(err);
        });

        // Resume audio safely across all iOS browsers
        function resumeAudio() {
            startOverlay.style.display = "none";

            setTimeout(() => {
                try {
                    if (
                        unityInstance &&
                        unityInstance.Module &&
                        unityInstance.Module.audioContext &&
                        typeof unityInstance.Module.audioContext.resume === "function"
                    ) {
                        unityInstance.Module.audioContext.resume().then(() => {
                            console.log("Audio resumed!");
                        }).catch((e) => {
                            console.warn("Audio resume failed", e);
                        });
                    }
                } catch (e) {
                    console.error("Audio resume error:", e);
                }
            }, 100); // slight delay helps iOS Safari
        }

        // Use both touchend and click for best mobile support
        startButton.addEventListener("click", resumeAudio);
        startButton.addEventListener("touchend", resumeAudio);
    </script>
</body>
</html>
