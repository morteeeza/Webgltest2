<script>
    let unityInstance;
    let useGyro = false;

    function sendPositionToUnity(x) {
        const fakeScreenWidth = window.innerWidth;
        const positionData = `${x},${fakeScreenWidth}`;
        unityInstance.SendMessage("LeftRoom", "OnWindowPosition", positionData);
        unityInstance.SendMessage("RightRoom", "OnWindowPosition", positionData);
    }

    function setupGyroControls() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            // iOS
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        useGyro = true;
                    }
                })
                .catch(console.error);
        } else {
            // Android
            window.addEventListener('deviceorientation', handleOrientation);
            useGyro = true;
        }
    }

    function handleOrientation(event) {
        const gamma = event.gamma; // left/right tilt in degrees
        // Clamp and normalize gamma (-90 to 90) to (0 to screenWidth)
        const fakeScreenX = ((gamma + 90) / 180) * window.innerWidth;
        sendPositionToUnity(fakeScreenX);
    }

    createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/TestOut.data",
        frameworkUrl: "Build/TestOut.framework.js",
        codeUrl: "Build/TestOut.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "new2",
        productVersion: "0.1.0"
    }).then((instance) => {
        unityInstance = instance;

        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            setupGyroControls();
        } else {
            // Desktop fallback
            setInterval(() => {
                const screenX = window.screenX;
                const availWidth = window.screen.availWidth;
                const positionData = `${screenX},${availWidth}`;
                unityInstance.SendMessage("LeftRoom", "OnWindowPosition", positionData);
                unityInstance.SendMessage("RightRoom", "OnWindowPosition", positionData);
            }, 100);
        }
    }).catch((error) => {
        alert("Error loading Unity: " + error);
    });
</script>
