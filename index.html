<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
    <title>AOP</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #231F20;
        }

        #unity-canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #enable-gyro {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #ffffffaa;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            z-index: 10;
            display: none;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #231F20;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            z-index: 100;
        }

        #loading-bar {
            width: 300px;
            height: 20px;
            background-color: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        #loading-fill {
            height: 100%;
            width: 0%;
            background-color: #fff;
            transition: width 0.2s ease;
        }

        #loading-text {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-text">Loading... 0%</div>
        <div id="loading-bar">
            <div id="loading-fill"></div>
        </div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <button id="enable-gyro">Enable Gyroscope</button>

    <script src="Build/TestOut.loader.js"></script>
    <script>
        let unityInstance;
        let useGyro = false;

        function sendPositionToUnity(x) {
            const fakeScreenWidth = window.innerWidth;
            const positionData = `${x},${fakeScreenWidth}`;
            unityInstance.SendMessage("LeftRoom", "OnWindowPosition", positionData);
            unityInstance.SendMessage("RightRoom", "OnWindowPosition", positionData);
        }

        function setupGyroControls() {
            const enableBtn = document.getElementById('enable-gyro');

            function handleOrientation(event) {
                const gamma = event.gamma || 0;
                const minTilt = -15;
                const maxTilt = 15;
                const clampedGamma = Math.max(minTilt, Math.min(maxTilt, gamma));
                const normalized = (clampedGamma - minTilt) / (maxTilt - minTilt);
                const fakeScreenX = normalized * window.innerWidth;
                sendPositionToUnity(fakeScreenX);
            }

            if (typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function") {
                enableBtn.style.display = 'block';
                enableBtn.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                enableBtn.style.display = 'none';
                                useGyro = true;
                            } else {
                                alert('Gyroscope permission denied.');
                            }
                        })
                        .catch(console.error);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                useGyro = true;
            }
        }

        createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/TestOut.data",
            frameworkUrl: "Build/TestOut.framework.js",
            codeUrl: "Build/TestOut.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "new2",
            productVersion: "0.1.0"
        }, (progress) => {
            const percent = Math.floor(progress * 100);
            document.getElementById("loading-text").innerText = `Loading... ${percent}%`;
            document.getElementById("loading-fill").style.width = percent + "%";
        }).then((instance) => {
            unityInstance = instance;
            document.getElementById("loading-overlay").style.display = "none";

            if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                setupGyroControls();
            } else {
                setInterval(() => {
                    const screenX = window.screenX;
                    const availWidth = window.screen.availWidth;
                    const positionData = `${screenX},${availWidth}`;
                    unityInstance.SendMessage("LeftRoom", "OnWindowPosition", positionData);
                    unityInstance.SendMessage("RightRoom", "OnWindowPosition", positionData);
                }, 100);
            }
        }).catch((error) => {
            alert("Error loading Unity: " + error);
        });
    </script>
</body>
</html>
