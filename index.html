<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unity WebGL | NewHy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #231F20;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
        // Prevent double-tap zoom and scrolling
        document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

        const loading = document.getElementById("loading");
        const canvas = document.getElementById("unity-canvas");

        createUnityInstance(canvas, {
            dataUrl: "Build/test1.data",
            frameworkUrl: "Build/test1.framework.js",
            codeUrl: "Build/test1.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "NewHy",
            productVersion: "0.1.0",
            webglContextAttributes: { powerPreference: "high-performance" }
        }, (progress) => {
            loading.textContent = `Loading... ${Math.round(progress * 100)}%`;
        }).then((unityInstance) => {
            loading.style.display = "none";
        }).catch((error) => {
            loading.innerHTML = `<p style="color:red">Error loading Unity WebGL.<br>${error}</p>`;
            console.error(error);
        });
    </script>

    <script src="Build/test1.loader.js"></script>
</body>
</html>
