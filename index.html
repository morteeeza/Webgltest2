<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unity WebGL | NewHy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #231F20;
            width: 100%;
            height: 100%;
            touch-action: none;
            -ms-touch-action: none;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 20px;
            text-align: center;
            animation: fadeInOut 2s infinite;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Loading... 0%</div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
        document.body.addEventListener('touchmove', function (event) {
            event.preventDefault();
        }, { passive: false });
    </script>

    <script src="Build/test1.loader.js"></script>
    <script>
        var loadingText = document.getElementById("loading");

        createUnityInstance(document.querySelector("#unity-canvas"), {
            arguments: [],
            dataUrl: "Build/test1.data",
            frameworkUrl: "Build/test1.framework.js",
            codeUrl: "Build/test1.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "NewHy",
            productVersion: "0.1.0",
            webglContextAttributes: { powerPreference: "high-performance" },
        }, (progress) => {
            loadingText.textContent = "Loading... " + Math.round(progress * 100) + "%";
        }).then((unityInstance) => {
            loadingText.style.display = "none";
        }).catch((error) => {
            console.error("Unity failed to load:", error);
            loadingText.innerHTML = "Error loading Unity.<br>Please reload the page.";
        });
    </script>
</body>
</html>
