<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1F1F20;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #loading,
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1F1F20;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.5em;
            flex-direction: column;
            pointer-events: auto;
        }

            #start-overlay button {
                margin-top: 1rem;
                padding: 0.5rem 1.2rem;
                font-size: 1rem;
                cursor: pointer;
                background: white;
                color: #1F1F20;
                border: none;
                border-radius: 8px;
            }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <div id="start-overlay" style="display: none;">
        <div>Click and drag</div>
        <button id="start-button">Start</button>
    </div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Silent audio for iOS mute bypass -->
    <audio id="silent-audio" playsinline style="display: none;">
        <source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA" type="audio/mp3">
    </audio>

    <script src="Build/39.loader.js"></script>
    <script>
        const canvas = document.getElementById("unity-canvas");
        const loading = document.getElementById("loading");
        const overlay = document.getElementById("start-overlay");
        const button = document.getElementById("start-button");
        const silentAudio = document.getElementById("silent-audio");

        let unityInstance = null;

        // Resize optimization: only trigger on animation frame
        const resizeCanvas = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap to 2x for performance
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
        };
        window.addEventListener("resize", () => requestAnimationFrame(resizeCanvas));
        resizeCanvas();

        // Unity Loader
        createUnityInstance(canvas, {
            dataUrl: "Build/39.data",
            frameworkUrl: "Build/39.framework.js",
            codeUrl: "Build/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: false,
            devicePixelRatio: 1 // we handle it manually above
        }).then((instance) => {
            unityInstance = instance;
            loading.style.display = "none";
            overlay.style.display = "flex";
        }).catch((err) => {
            loading.innerText = "❌ Failed to load game";
            console.error(err);
        });

        function unlockiOSAudio() {
            if (silentAudio) {
                silentAudio.play().catch(() => { });
            }
        }

        function tryResumeUnityAudio() {
            const ctx = unityInstance?.Module?.audioContext;
            if (ctx?.state === "suspended") {
                ctx.resume().catch(() => { });
            }
        }

        const startGame = () => {
            overlay.style.display = "none";
            unlockiOSAudio();
            tryResumeUnityAudio();
        };

        button.addEventListener("click", startGame);
        button.addEventListener("touchend", startGame);
    </script>
</body>
</html>
