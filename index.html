<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1F1F20;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #loading-overlay, #tap-to-start {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
            color: white;
            font-family: sans-serif;
            font-size: 1.5em;
            z-index: 10;
        }

        #tap-to-start {
            display: none;
            background: rgba(0,0,0,0.85);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading-overlay">Loading...</div>
        <div id="tap-to-start">Tap to Start</div>
    </div>

    <script src="Build/39.loader.js"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loading = document.getElementById("loading-overlay");
        const tapToStart = document.getElementById("tap-to-start");

        let unityInstance;

        createUnityInstance(canvas, {
            dataUrl: "Build/39.data",
            frameworkUrl: "Build/39.framework.js",
            codeUrl: "Build/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: true,
            devicePixelRatio: 1
        }).then((instance) => {
            unityInstance = instance;
            loading.style.display = "none";

            // On mobile, wait for a tap to unlock audio
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                tapToStart.style.display = "flex";
                tapToStart.addEventListener("click", () => {
                    unityInstance.SendMessage('GameObjectName', 'OnUserInteraction'); // Optional Unity method
                    tapToStart.style.display = "none";
                    unityInstance.Module?.resumeAudio?.();
                });
            }
        }).catch((err) => {
            loading.textContent = "Failed to load game.";
            console.error(err);
        });
    </script>
</body>
</html>
