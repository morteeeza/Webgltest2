<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1F1F20;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
        }

        #unity-canvas {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/39.loader.js"></script>
    <script>
        createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/39.data",
            frameworkUrl: "Build/39.framework.js",
            codeUrl: "Build/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: true,
            devicePixelRatio: 1
        }).then(() => {
            console.log("Unity loaded");
        }).catch((err) => {
            console.error(err);
        });
    </script>
</body>
</html>
