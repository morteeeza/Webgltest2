<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1F1F20;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1F1F20;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1F1F20;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/39.loader.js"></script>
    <script>
        const canvas = document.getElementById("unity-canvas");
        const loadingScreen = document.getElementById("loading");

        // Optional: manually match resolution to device pixel ratio for sharper visuals
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        createUnityInstance(canvas, {
            dataUrl: "Build/39.data",
            frameworkUrl: "Build/39.framework.js",
            codeUrl: "Build/39.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "test2",
            productVersion: "1.0",
            matchWebGLToCanvasSize: false, // we manually resize
            devicePixelRatio: window.devicePixelRatio || 1
        }).then(() => {
            loadingScreen.style.display = 'none';
            console.log("Unity loaded");
        }).catch((err) => {
            loadingScreen.innerText = "Failed to load game.";
            console.error(err);
        });
    </script>
</body>
</html>
